<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Families - Digital Health Record</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Common CSS -->
    <link rel="stylesheet" href="css/common.css">
    <!-- Families CSS -->
    <link rel="stylesheet" href="css/families.css">
</head>
<body>
<div class="container-fluid">
    <!-- MOBILE NAVBAR -->
    <nav class="mobile-navbar d-md-none">
        <button class="mobile-menu-btn" type="button" data-bs-toggle="offcanvas" data-bs-target="#mobileSidebar">
            <i class="bi bi-list"></i>
        </button>
        <span class="mobile-navbar-title"><i class="bi bi-heart-pulse"></i> Health Record</span>
    </nav>

    <!-- MOBILE SIDEBAR -->
    <div class="offcanvas offcanvas-start d-md-none" tabindex="-1" id="mobileSidebar">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title"><i class="bi bi-heart-pulse"></i> Health Record</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body">
            <a href="dashboard.html" class="mobile-menu-link"><i class="bi bi-speedometer2"></i> Dashboard</a>
            <a href="#" class="mobile-menu-link" onclick="goToAddFamily(); return false;"><i class="bi bi-person-plus"></i> Add Family</a>
            <a href="families.html" class="mobile-menu-link"><i class="bi bi-people"></i> Families</a>
            <a href="profile.html" class="mobile-menu-link"><i class="bi bi-person-circle"></i> Profile</a>
            <a href="#" class="mobile-menu-link" onclick="logoutUser()"><i class="bi bi-box-arrow-right"></i> Logout</a>
        </div>
    </div>   

    <div class="row">
        <!-- SIDEBAR -->
        <div class="col-md-3 col-lg-2 sidebar p-3 d-none d-md-block">
            <h4 class="mb-4"><i class="bi bi-heart-pulse"></i> Health Record</h4>
            <a href="dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
            <a href="#" onclick="goToAddFamily(); return false;"><i class="bi bi-person-plus"></i> Add Family</a>
            <a href="families.html" class="active"><i class="bi bi-people"></i> Families</a>
            <a href="profile.html"><i class="bi bi-person-circle"></i> Profile</a>
            <a href="#" onclick="logoutUser()"><i class="bi bi-box-arrow-right"></i> Logout</a>
        </div>

        <!-- MAIN CONTENT -->
        <div class="col-md-9 col-lg-10 dashboard-content">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2><i class="bi bi-people"></i> Family Records</h2>
                    <p class="text-muted">View and manage all registered families</p>
                </div>
                <a href="#" onclick="goToAddFamily(); return false;" class="btn btn-primary"><i class="bi bi-person-plus"></i> Add New Family</a>
            </div>

            <!-- SEARCH + COUNT -->
            <div class="form-section mb-4">
                <div class="row align-items-center g-3">
                    <div class="col-md-8">
                        <label class="form-label">Search Families</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-search"></i></span>
                            <input type="text" class="form-control" id="familySearch" placeholder="Search by ID, Name, or Govt IDs..." onkeyup="searchFamilies()">
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="family-count-box">
                            <span class="text-muted">Total Families</span>
                            <strong id="totalFamilies">0</strong>
                        </div>
                    </div>
                </div>
            </div>

            <div id="familyList"></div>

            <div id="noFamilies" class="alert alert-info d-none">
                <i class="bi bi-info-circle"></i> No family records found. 
                <a href="#" onclick="goToAddFamily(); return false;" class="alert-link">Add your first family</a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/common.js"></script>
<script src="js/families.js"></script>
</body>
</html>
